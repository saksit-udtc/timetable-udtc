<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบจัดตารางเรียน–ตารางสอน (ลาก-วาง)</title>
<style>:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--mut:#667085;--line:#d9dde5;--pri:#2457c5;--ok:#1f9d55;--bad:#d92d20;--warn:#d98a00;--gen:#d7efe0;--dept:#dbe7fb;--act:#e6e8ec}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--ink:#e6e9ef;--mut:#98a2b3;--line:#323946;--pri:#6f9bff;--gen:#1d4130;--dept:#1f3359;--act:#2c313b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Sarabun","Noto Sans Thai",system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--pri)}button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button:disabled{opacity:.45;cursor:default}
header#top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column;line-height:1.2}.brand span{color:var(--mut);font-size:12px}
nav#tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}nav#tabs button{border-radius:999px;padding:5px 14px}nav#tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
#banner{display:none;padding:6px 14px;background:#fff4d6;color:#7a5200;border-bottom:1px solid #ecd58f}#banner.show{display:block}
main{padding:12px 14px 60px}
footer#status{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:5px 14px;display:flex;justify-content:space-between;gap:12px;z-index:20}
#msg.bad{color:var(--bad)}#msg.ok{color:var(--ok)}#stat b{margin-left:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--mut)}.small{font-size:12px}
table.t{border-collapse:collapse;width:100%}table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}table.t th{position:sticky;top:52px;background:var(--card);z-index:2}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--dept);border-radius:999px;padding:1px 8px;margin:1px;font-size:12px}.chip i{cursor:pointer;font-style:normal;opacity:.6}.chip.g{background:var(--gen)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px;align-items:start}@media(max-width:1000px){.two{grid-template-columns:1fr}}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.bar.over i{background:var(--bad)}
.kind{font-size:11px;padding:1px 6px;border-radius:4px}.kind.DEPT{background:var(--dept)}.kind.GEN{background:var(--gen)}.kind.ACT{background:var(--act)}
/* grid */
#gridbox{display:flex;gap:12px;align-items:flex-start}#gridcol{flex:1;min-width:0;overflow-x:auto}#side{width:250px;flex:none;position:sticky;top:60px;max-height:calc(100vh - 120px);overflow:auto}
.gwrap{display:grid;min-width:720px}.ghead{display:grid;background:var(--card);border:1px solid var(--line);border-bottom:0;min-width:720px}
.ghead div{padding:5px;text-align:center;font-weight:600;border-left:1px solid var(--line)}.ghead div:first-child{border-left:0}
.tcol{border:1px solid var(--line);border-right:0}.tcol div{border-bottom:1px solid var(--line);padding:2px 4px;font-size:11px;color:var(--mut);text-align:right}
.dcol{position:relative;border:1px solid var(--line);border-right:0;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--H) - 1px),var(--line) calc(var(--H) - 1px),var(--line) var(--H))}
.dcol:last-child{border-right:1px solid var(--line)}.dcol.off{background-color:rgba(128,128,128,.07)}
.unav{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,rgba(120,120,120,.28) 0 4px,transparent 4px 8px);pointer-events:none}
.unavEdit .unav{pointer-events:auto;cursor:pointer}.unavEdit .dcol{cursor:cell}
.blk{position:absolute;border-radius:6px;padding:2px 5px;font-size:12px;line-height:1.25;overflow:hidden;border:1px solid rgba(0,0,0,.18);cursor:grab;user-select:none}
.blk.DEPT{background:var(--dept)}.blk.GEN{background:var(--gen)}.blk.ACT{background:var(--act)}
.blk.lock{cursor:not-allowed;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.06) 0 5px,transparent 5px 10px)}
.blk.fix{cursor:pointer}.blk.bad{outline:2px solid var(--bad);z-index:3}.blk.warn{outline:2px dashed var(--warn);z-index:2}.blk.sel{box-shadow:0 0 0 2px var(--pri)}
.blk b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blk small{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{position:absolute;left:2px;right:2px;border-radius:6px;pointer-events:none;z-index:9;font-size:11px;padding:2px 4px;overflow:hidden}.ghost.ok{background:rgba(31,157,85,.25);border:2px solid var(--ok)}.ghost.bad{background:rgba(217,45,32,.22);border:2px solid var(--bad)}.ghost.warn{background:rgba(217,138,0,.22);border:2px solid var(--warn)}
.tray .blk{position:static;display:inline-block;margin:2px;min-width:110px;height:auto;padding:3px 6px}
.rule{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}.rule.off{opacity:.55}.rule .ps{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.rule label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
dialog{border:1px solid var(--line);border-radius:12px;padding:16px;max-width:680px;width:92vw;background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mut)}dialog input[type=text],dialog select,dialog textarea{width:100%}
.cb{display:flex;flex-wrap:wrap;gap:4px 12px;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px}.cb label{display:flex;gap:4px;margin:0;color:var(--ink);font-size:13px}
.vlist{max-height:55vh;overflow:auto}.vlist div{padding:3px 0;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}.vlist .b{color:var(--bad)}.vlist .w{color:var(--warn)}
@media print{header#top,#banner,footer#status,#side,.noprint{display:none!important}.ghead,.tcol div{position:static}main{padding:0}}

.blk-in{width:70px}

/* ===== รูปแบบตาราง: แถว=วัน คอลัมน์=คาบ (ตามต้นแบบ) ===== */
:root{--teal:#35809e;--teal2:#2b6f8b;--cellblue:#c9e0f8;--redcell:#ffb3b3}
.tt{border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:960px;background:#fff;color:#1d2433}
.ttitle{background:#2f7bc8;color:#fff;font-weight:700;padding:7px 12px}.ttitle .mut2{font-weight:400;opacity:.85;font-size:12px}
.hrow,.trow{display:grid}
.th{background:var(--teal);color:#fff;font-weight:700;text-align:center;padding:6px 3px;border-left:1px solid #fff;font-size:12.5px;line-height:1.25;display:flex;align-items:center;justify-content:center}
.dlab{background:var(--teal);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;border-top:1px solid #fff;padding:4px;font-size:13px}
.rarea{position:relative;display:grid;min-height:80px}
.cell{border-left:1px dashed var(--teal2);border-top:1px dashed var(--teal2);background:#fff}.cell:first-child{border-left:0}
.trow:first-of-type .cell{border-top:0}
.rarea .blk{position:absolute;border:1px dashed var(--teal2);border-radius:0;background:var(--cellblue);color:#111;padding:3px 4px;font-size:12px;line-height:1.3;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;cursor:grab}
.rarea .blk.GEN{background:#cfeedd}.rarea .blk.ACT{background:#e4e6ea}
.rarea .blk.lock{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.05) 0 5px,transparent 5px 10px);cursor:not-allowed}
.rarea .blk.bad{outline:2px solid var(--bad);outline-offset:-2px;z-index:3}.rarea .blk.warn{outline:2px dashed var(--warn);outline-offset:-2px;z-index:2}
.rarea .blk.sel{box-shadow:inset 0 0 0 2px var(--pri)}
.blk .n{color:#d00}.blk .pi{vertical-align:-1px;margin-right:2px}
.ux{position:absolute;top:0;bottom:0;background:var(--redcell);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:2px;border:1px solid #fff;pointer-events:none;z-index:1}
.ghost{top:0;bottom:0;left:0;height:auto;display:flex;align-items:center;justify-content:center;text-align:center;z-index:9}
.tray .blk{background:var(--cellblue);color:#111;text-align:center;border:1px dashed var(--teal2);border-radius:0}.tray .blk.GEN{background:#cfeedd}.tray .blk.ACT{background:#e4e6ea}
@media print{@page{size:landscape;margin:8mm}.tt{min-width:0}.cell,.ux,.rarea .blk,.th,.dlab,.ttitle{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ===== ชุดสีใหม่: ชัด อ่านง่าย สบายตา ===== */
:root{--teal:#1f6f8b;--teal2:#a9c3cf;--redcell:#f9d3d3}
.tt{background:#fff;color:#18222d;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ttitle{background:#27608f;font-size:15px}
.th{background:#1f6f8b;border-left:1px solid rgba(255,255,255,.35);font-size:12.5px}
.dlab{background:#1f6f8b;border-top:1px solid rgba(255,255,255,.35);font-size:14px}
.trow:nth-child(even) .cell{background:#f7fafc}
.trow:nth-last-child(-n+2) .cell{background:#eef1f4}
.cell{border-left:1px dashed var(--teal2);border-top:1px dashed var(--teal2)}
.rarea .blk,.tray .blk{background:hsl(var(--h) 78% 91%);border:1px solid hsl(var(--h) 45% 72%);border-left:5px solid hsl(var(--h) 58% 42%);color:#18222d;font-size:12.5px;border-radius:4px;margin:1px}
.rarea .blk.lock{background-image:none;background:hsl(var(--h) 25% 92%);border-left-color:hsl(var(--h) 20% 45%)}
.rarea .blk.lock>div:first-child{font-weight:600}
.rarea .blk>div:first-child{font-weight:600}
.blk .n{color:#c62828;font-weight:600}
.rarea .blk:hover{filter:brightness(.97);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.rarea .blk.bad{outline:3px solid #d32f2f;outline-offset:-2px;background:hsl(0 85% 93%)}
.rarea .blk.warn{outline:2px dashed #e08600;outline-offset:-2px}
.rarea .blk.sel{box-shadow:inset 0 0 0 2px #1e66f5}
.ux{background:var(--redcell);color:#8a1c1c;font-weight:600;border:1px solid #fff}
.ghost.ok{background:rgba(46,160,90,.28);border:2px solid #2ea05a}.ghost.warn{background:rgba(224,134,0,.25);border:2px solid #e08600}.ghost.bad{background:rgba(211,47,47,.25);border:2px solid #d32f2f}
.tray .blk{border-radius:4px}

/* ===== แบบพิมพ์ตารางสอนรายบุคคล ===== */
#printArea{display:none}
@media print{
 body{background:#fff!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;color:#000;font-family:"TH Sarabun New","TH SarabunPSK","Sarabun","Noto Sans Thai",sans-serif}
 @page{size:A4 landscape;margin:6mm}
 .pp{page-break-after:always;font-size:8.5pt;line-height:1.2;width:calc(100% - 3mm)}.pp:last-child{page-break-after:auto}
 .phead{display:flex;gap:6px;align-items:stretch;margin-bottom:4px}
 .pleft{flex:0 0 38%}.pl{display:flex;align-items:center;gap:6px;margin-bottom:2px}
 .pr{flex:1;display:flex;flex-direction:column;gap:3px}
 .pp table{border-collapse:collapse}
 .pp td,.pp th{border:.7pt solid #000;padding:1px 3px;text-align:center;vertical-align:middle;font-weight:400}
 .pp .pinfo{width:100%}.pp .pinfo td{border:0;text-align:left;padding:0 3px}.pp .pinfo td:nth-child(odd){font-weight:700;width:1%;white-space:nowrap}
 .pp .pc{flex:1}.pp .two2{display:flex;gap:0}.pp .two2 .pc{width:50%}.pp .pc th{font-weight:700;font-size:7.5pt}.pp .pc td{font-size:7.5pt;padding:0 2px}.pp .pc td.nm{text-align:left}
 .pp .ps2{width:55%;margin-left:auto}.pp .ps2 th{font-weight:700}
 .pp .ptt{width:100%;table-layout:fixed;margin-top:3px}.pp .ptt th{font-size:7.5pt;font-weight:400;padding:2px 1px}
 .pp .ptt td{height:19mm;font-size:7.5pt;line-height:1.25;padding:1px 2px}.pp .ptt td div{overflow-wrap:anywhere}
 .pp .ptt th.dn{font-weight:700;font-size:9pt}.pp .ptt th.dl,.pp .ptt th.sm{font-size:7pt}
 .pp .ptt td.un{background:#fff}
 .psig{display:flex;justify-content:space-around;text-align:center;margin-top:14px;font-size:8.5pt}.psig>div{width:24%}.psig .sl{margin-bottom:2px}
 .pdate{font-size:7.5pt;margin-top:2px}
}
@media print{.pl>.logo{width:58px;height:58px;flex:none}.pl>.logo img{max-width:100%;max-height:100%}}
.pi2{display:flex;flex-direction:column;align-items:center;flex:1;font-size:9pt}

@media print{
 .pp .pc{table-layout:fixed;width:100%}
 .pp .pc th:nth-child(1),.pp .pc td:nth-child(1){width:19%}
 .pp .pc th:nth-child(n+3),.pp .pc td:nth-child(n+3){width:6%}
 .pp .pc td{overflow-wrap:anywhere}
 .pp .ps2{width:60%}
}

@media print{
 .pr{gap:0!important}
 .pp .two2{width:100%}
 .pp .two2 .pc{width:50%}
 .pp .ps2{width:50%!important;margin-left:50%!important;table-layout:fixed}
 .pp .ps2 th:nth-child(1),.pp .ps2 td:nth-child(1){width:19%}
 .pp .ps2 th:nth-child(2),.pp .ps2 td:nth-child(2){width:19%}
 .pp .ps2 th:nth-child(3),.pp .ps2 td:nth-child(3){width:22%}
 .pp .ps2 th,.pp .ps2 td{padding:0 2px!important;font-size:7.5pt;line-height:1.15}
 .pp .pc td,.pp .pc th{line-height:1.15}
}
</style></head><body>
<header id="top">
  <div class="brand"><b>ระบบจัดตารางเรียน–ตารางสอน</b><span id="termLbl"></span></div>
  <nav id="tabs"></nav>
  <div class="acts">
    <button id="bUndo" title="Ctrl+Z">↶ ย้อน</button><button id="bRedo" title="Ctrl+Y">↷ ทำซ้ำ</button>
    <select id="presetSel" title="โหลดตารางจากผลที่เตรียมไว้"></select>
    <button id="bXls" class="pri">Excel นำเข้า/ส่งออก</button><button id="bSave">บันทึกไฟล์</button><button id="bOpen">เปิดไฟล์</button><button id="bNew">เทอมใหม่</button><button id="bPrint">พิมพ์</button>
    <input type="file" id="fileIn" accept=".json" hidden><input type="file" id="csvIn" accept=".csv" hidden>
  </div>
</header>
<div id="banner"></div>
<main id="main"></main>
<footer id="status"><span id="msg"></span><span id="stat"></span></footer>
<dialog id="dlg"></dialog>
<div id="printArea"></div>

<script>"use strict";

const NUM = (k, label, def) => ({ k, label, type: "num", def });
const RULE_TYPES = {
  bounds: { label: "อยู่ในช่วงคาบของวัน", core: 1, desc: "คาบเริ่ม–จบต้องอยู่ในวันเรียน", params: [],
    check: c => c.items.filter(i => i.s < (c.S.config.preSlot ? 0 : 1) || i.e > c.S.config.periods || i.d < 0 || i.d >= c.S.config.days).map(i => ({ keys: [i.key], msg: `${c.nm(i)} ${c.when(i)} เกินช่วงคาบ` })) },
  cross_break: { label: "ห้ามคร่อมเวลาพัก", core: 1, desc: "วิชาที่ต่อเนื่องห้ามคร่อมเวลาพักที่ตั้งไว้ใน config", params: [],
    check: c => { const br = c.S.config.breakAfter || []; return c.items.filter(i => br.some(b => i.s <= b && i.e >= b + 1)).map(i => ({ keys: [i.key], msg: `${c.nm(i)} คร่อมเวลาพัก` })); } },
  teacher_clash: { label: "ครูสอนซ้อนเวลา", core: 1, desc: "ครูคนเดียวสอนสองวิชาในเวลาเดียวกันไม่ได้", params: [],
    check: c => Object.entries(c.byT).flatMap(([t, a]) => pairs(a).map(([x, y]) => ({ keys: [x.key, y.key], msg: `${c.tn(t)} ซ้อน ${c.nm(x)} / ${c.nm(y)} ${c.when(x)}` }))) },
  group_clash: { label: "กลุ่มเรียนเรียนซ้อนเวลา", core: 1, desc: "นักศึกษากลุ่มเดียวเรียนสองวิชาพร้อมกันไม่ได้", params: [],
    check: c => Object.entries(c.byG).flatMap(([g, a]) => pairs(a).map(([x, y]) => ({ keys: [x.key, y.key], msg: `${c.gn(g)} ซ้อน ${c.nm(x)} / ${c.nm(y)} ${c.when(x)}` }))) },
  room_clash: { label: "ห้องถูกใช้ซ้อนเวลา", core: 1, desc: "ห้องเดียวใช้พร้อมกันสองวิชาไม่ได้ (ยกเว้นห้องที่ตั้งเป็น 'ใช้ร่วมได้')", params: [],
    check: c => Object.entries(c.byR).filter(([r]) => !(c.S.rooms[r]?.shared)).flatMap(([r, a]) => pairs(a).map(([x, y]) => ({ keys: [x.key, y.key], msg: `ห้อง ${r} ซ้อน ${c.nm(x)} / ${c.nm(y)} ${c.when(x)}` }))) },
  teacher_unavail: { label: "ครูลงเวลาที่ไม่ว่าง", core: 1, desc: "เวลาที่ครูติดภารกิจ/กิจกรรม/PLC (แถบลายเฉียงในตารางครู)", params: [],
    check: c => c.items.flatMap(i => i.les.teachers.flatMap(t => { const u = c.unav[t]; if (!u) return []; for (let p = i.s; p <= i.e; p++) if (u.has(i.d + "|" + p)) return [{ keys: [i.key], msg: `${c.tn(t)} ไม่ว่าง ${c.nm(i)} ${c.when(i)}` }]; return []; })) },
  room_type: { label: "ประเภทห้องตรงกับวิชา", core: 1, desc: "วิชาที่กำหนดประเภทห้อง ต้องลงห้องประเภทนั้น", params: [],
    check: c => c.items.filter(i => i.les.roomType && (!i.room || c.S.rooms[i.room]?.type !== i.les.roomType)).map(i => ({ keys: [i.key], msg: `${c.nm(i)} ต้องใช้ห้องประเภท ${i.les.roomType}${i.room ? " (ตอนนี้ " + i.room + ")" : " (ยังไม่ระบุห้อง)"}` })) },
  same_day: { label: "คาบของวิชาเดียวกันไม่ควรอยู่วันเดียวกัน", desc: "กระจายคาบของวิชาเดียวกันคนละวัน (ยกเว้นวิชาที่ติ๊ก 'ซ้ำวันได้')", params: [],

  teacher_max_day: { label: "ครูสอนไม่เกิน N คาบ/วัน", desc: "จำนวนคาบสอนต่อวันของครู (ค่าเฉพาะครูแต่ละคนตั้งในข้อมูลหลัก ถ้าไม่ตั้งใช้ค่านี้)", params: [NUM("n", "N คาบ", 8)],
    check: (c, p) => perEntity(c, c.byT, (t, d, a) => { const lim = c.S.teachers[t]?.maxPerDay || p.n; const n = sum(a); return n > lim ? { keys: a.map(i => i.key), msg: `${c.tn(t)} สอน ${n} คาบใน${DAYS[d]} (เกิน ${lim})` } : null; }) },
  teacher_max_run: { label: "ครูสอนติดกันไม่เกิน N คาบ", desc: "สอนต่อเนื่องไม่มีช่วงพัก (ค่าเฉพาะครูแต่ละคนตั้งในข้อมูลหลัก)", params: [NUM("n", "N คาบ", 6)],
    check: (c, p) => perEntity(c, c.byT, (t, d, a) => { const lim = c.S.teachers[t]?.maxRun || p.n; const r = longestRun(a); return r.len > lim ? { keys: r.items.map(i => i.key), msg: `${c.tn(t)} สอนติดกัน ${r.len} คาบ ${DAYS[d]} (เกิน ${lim})` } : null; }) },
  teacher_gap: { label: "ครูมีช่องว่างระหว่างคาบเกิน N คาบ", desc: "คาบว่างคั่นกลางระหว่างคาบสอนในวันเดียวกัน", params: [NUM("n", "ว่างได้ไม่เกิน", 1)],
    check: (c, p) => perEntity(c, c.byT, (t, d, a) => gapViol(a, p.n, `${c.tn(t)} ว่างคั่นกลาง`, d)) },

  for (const r of best) { const ci = r.findIndex(x => typeof x === "string" && CODE.test(x)); if (ci < 0) continue; const rest = r.slice(ci + 1), nums = rest.filter(x => typeof x === "number"), txt = rest.filter(x => typeof x === "string" && x.trim()).map(x => x.trim());
    const teacher = txt.find(x => x.startsWith("อ.")) || "", note = txt.slice(1).find(x => !x.startsWith("อ.")) || "", level = ci ? sv(r[ci - 1]) : "";
    out.push({ code: CODE.exec(r[ci])[1].replace("*", "-"), name: txt[0] || "", t: nums.length >= 3 ? nums[0] : null, p: nums.length >= 3 ? nums[1] : null, n: nums.length >= 3 ? nums[2] : null, teacher: teacher.replace(/อ\./g, "").trim(), gtext: note || level, inc: true }); }

}
function summaryDlg(rows, mode) {

   <div class="row" style="margin:6px 0"><label><input type="radio" name="sm" value="merge" ${mode === "merge" ? "checked" : ""}> ผสานกับของเดิม (อัปเดตวิชาที่ซ้ำ เพิ่มวิชาใหม่)</label><label><input type="radio" name="sm" value="replace" ${mode === "replace" ? "checked" : ""}> แทนที่ภาระงาน "วิชาแผนก" ทั้งหมด</label></div>
   <div style="max-height:52vh;overflow:auto"><table class="t"><thead><tr><th></th><th>รหัส</th><th>ชื่อวิชา</th><th>ท-ป-น</th><th>ครู</th><th>กลุ่มเรียน (ตามไฟล์)</th><th>ผลจับคู่</th><th>แบ่งคาบ</th></tr></thead><tbody>
   ${rows.map((x, i) => `<tr data-i="${i}"><td><input type="checkbox" class="ic" ${x.inc ? "checked" : ""}></td><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${x.t ?? "-"}-${x.p ?? "-"}-${x.n ?? "-"}</td><td><input class="it" size="10" value="${esc(x.teacher)}"></td><td><input class="ig" size="26" value="${esc(x.gtext)}"></td><td class="st">${stat(x)}</td><td><input class="ib" size="7" value="${x.blocks}"></td></tr>`).join("")}</tbody></table></div>

function applySummary(rows, mode) {

  for (const x of rows) { const where = `${x.code}`, groups = ensureGroups(W, x.gtext, warn, where), teachers = ensureTeachers(W, x.teacher, warn, where); if (!teachers.length) warn.push(`${where}: ไม่มีครู`);
    if (x.t !== null) W.courses[x.code] = { t: x.t, p: x.p, n: x.n }; let b = parseBlocks(x.blocks); if (!b.length) b = defaultBlocks((x.t || 0) + (x.p || 0));
    upsertLesson(W, { code: x.code, name: x.name || x.code, kind: "DEPT", groups, teachers, blocks: b, roomType: hasDept && groups.length && groups.every(g => W.groups[g]?.complete !== false) ? "DEPT" : null, sameDay: false }); }

}
/* ---- ส่งออกข้อมูลเทอมเป็น Excel ---- */
function stateToSheets() {
  const SC = window.TT_SCHEMA, c = S.config, out = {}, tv = { 0: S.term, 1: S.print.college, 2: S.print.dept, 3: S.print.range, 4: c.days, 5: c.periods, 6: hm(c.firstStartMin), 7: c.periodMin, 8: (c.breakAfter || []).join(","), 9: c.preSlot ? "ใช่" : "ไม่" };
  out.term = SC[0].rows.map((r, i) => [r[0], tv[i], r[2]]);
  out.groups = Object.values(S.groups).map(g => [g.name, g.size ?? "", g.complete !== false ? "ใช่" : "ไม่", (g.alias || []).join(";")]);
  out.teachers = Object.entries(S.teachers).map(([id, t]) => [id, t.name, t.fullName || "", t.degree || "", t.duty || "", t.dept === "EXT" ? "นอกแผนก" : "ในแผนก", t.target ?? "", t.maxPerDay ?? "", t.maxRun ?? ""]);
  out.unav = []; for (const [id, t] of Object.entries(S.teachers)) { const u = [...(t.unav || [])].sort((a, b) => a[0] - b[0] || a[1] - b[1]); let i = 0; while (i < u.length) { let j = i; while (j + 1 < u.length && u[j + 1][0] === u[i][0] && u[j + 1][1] === u[j][1] + 1 && (u[j + 1][2] || "") === (u[i][2] || "")) j++; out.unav.push([id, DAYS[u[i][0]], u[i][1], u[j][1], u[i][2] || ""]); i = j + 1; } }
  out.rooms = Object.entries(S.rooms).map(([id, r]) => [id, r.type, r.shared ? "ใช่" : "ไม่", ""]);
  const fixedL = l => l.kind !== "DEPT" || l.blocks.every((_, i) => S.placements[l.id + "#" + (i + 1)]?.l);
  out.lessons = S.lessons.filter(l => !fixedL(l)).map(l => { const h = S.courses[l.code] || {}; return [KIND_OF[l.kind], l.code, l.name, h.t ?? "", h.p ?? "", h.n ?? "", l.groups.join("+"), l.teachers.join(";"), l.blocks.join(","), l.roomType || "", l.sameDay ? "ใช่" : "ไม่"]; });
  out.fixed = S.lessons.filter(fixedL).flatMap(l => l.blocks.map((len, i) => { const p = S.placements[l.id + "#" + (i + 1)]; return p ? [KIND_OF[l.kind], l.code, l.name, l.groups.join("+"), l.teachers.join(";"), DAYS[p.d], p.s, len, p.r || "", p.l ? "ใช่" : "ไม่"] : null; }).filter(Boolean));
  out.rules = SC[7].rows.map(r => { const rule = S.rules.find(x => x.type === r[0]); return rule ? [r[0], r[1], { block: "บล็อก", warn: "เตือน", off: "ปิด" }[rule.sev], rule.p?.n ?? ""] : r; });
  out.sign = S.print.sig.map((x, i) => [i + 1, x[0], x[1]]);
  return out;
}

function dlB64(name, b64) { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([u], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

      if (isT) { d.close(); previewApply(applyTemplate(wb, mode), "ตรวจผลก่อนนำเข้า (เทมเพลตข้อมูลเทอม)"); }

}
